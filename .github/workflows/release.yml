name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: "${{ matrix.target }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: pdf-slim
          - os: macos-14
            target: aarch64-apple-darwin
            bin: pdf-slim
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bin: pdf-slim.exe

    runs-on: "${{ matrix.os }}"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "${{ matrix.target }}"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: "${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}"
          restore-keys: |
            "${{ runner.os }}-cargo-deps-"

      - name: Build release
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Run tests
        if: "matrix.target == 'x86_64-unknown-linux-gnu'"
        run: cargo test --release --target "${{ matrix.target }}"

      - name: Strip binary (Linux)
        if: "contains(matrix.target, 'linux')"
        run: |
          strip "target/${{ matrix.target }}/release/${{ matrix.bin }}"

      - name: Strip binary (macOS)
        if: "contains(matrix.target, 'darwin')"
        run: |
          strip "target/${{ matrix.target }}/release/${{ matrix.bin }}"

      - name: Create archive (Unix)
        if: "!contains(matrix.os, 'windows')"
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          NAME="pdf-slim-${{ github.ref_name }}-${{ matrix.target }}"
          tar czf "../../../${NAME}.tar.gz" "${{ matrix.bin }}"

      - name: Create archive (Windows)
        if: "contains(matrix.os, 'windows')"
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          NAME="pdf-slim-${{ github.ref_name }}-${{ matrix.target }}"
          tar -c -f "../../../${NAME}.tar" "${{ matrix.bin }}"
          gzip "../../../${NAME}.tar"

      - name: Checksums (Linux)
        if: "contains(matrix.target, 'linux')"
        run: |
          sha256sum "target/${{ matrix.target }}/release/${{ matrix.bin }}" > "checksums-${{ matrix.target }}.txt"

      - name: Checksums (macOS)
        if: "contains(matrix.target, 'darwin')"
        run: |
          shasum -a 256 "target/${{ matrix.target }}/release/${{ matrix.bin }}" > "checksums-${{ matrix.target }}.txt"

      - name: Checksums (Windows)
        if: "contains(matrix.os, 'windows')"
        shell: bash
        run: |
          cmd //c "certutil -hashfile target\${{ matrix.target }}\release\${{ matrix.bin }} SHA256" > "checksums-${{ matrix.target }}.txt" 2>&1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "pdf-slim-${{ matrix.target }}"
          path: |
            pdf-slim-${{ github.ref_name }}-${{ matrix.target }}.*
            checksums-${{ matrix.target }}.txt

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' | while IFS= read -r f; do
            cp "$f" release/
          done
          find artifacts -name 'checksums-*.txt' -exec cat {} + > release/checksums.txt

      - name: Create Release
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
