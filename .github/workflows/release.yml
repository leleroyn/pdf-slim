name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: pdf-slim
            extension: ""
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            bin: pdf-slim
            extension: ""
          - os: macos-13
            target: x86_64-apple-darwin
            bin: pdf-slim
            extension: ""
          - os: macos-14
            target: aarch64-apple-darwin
            bin: pdf-slim
            extension: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: pdf-slim.exe
            extension: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-target-

      - name: Install cross-compilation dependencies (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu aarch64-linux-gnu libc6-arm64-cross
          rustup target add aarch64-unknown-linux-gnu

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target $TARGET

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.bin }}

      - name: Strip binary (macOS)
        if: contains(matrix.target, 'darwin')
        run: |
          strip -x target/${{ matrix.target }}/release/${{ matrix.bin }}

      - name: Create archive
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          NAME="pdf-slim-${{ github.ref_name }}-${{ matrix.target }}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a "../../../${NAME}.zip" "${{ matrix.bin }}"
          else
            tar czf "../../../${NAME}.tar.gz" "${{ matrix.bin }}"
          fi
          cd -

      - name: Calculate checksums
        run: |
          sha256sum target/${{ matrix.target }}/release/pdf-slim* > checksums-${{ matrix.target }}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-slim-${{ matrix.target }}
          path: |
            pdf-slim-${{ github.ref_name }}-${{ matrix.target }}.*
            checksums-${{ matrix.target }}.txt

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -o -name '*.zip' | while read f; do
            cp "$f" release/
          done
          find artifacts -name 'checksums-*.txt' | while read f; do
            cat "$f" >> release/checksums.txt
            echo "" >> release/checksums.txt
          done

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --title "Release ${{ github.ref_name }}" \
            --notes "## What's New

          ### Features
          - Image compression with JPEG re-encoding and downscaling
          - FlateDecode + DCTDecode support for scanned PDFs
          - Stream compression for uncompressed PDF data
          - Digital signature detection (skips signed PDFs)
          - Encrypted PDF rejection
          - Force mode with automatic backup
          - Info mode for PDF analysis
          - JSON reporting (stdout and file output)
          - Batch processing
          - Three compression presets: gentle, balanced, aggressive

          ### Build Targets
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc

          ### Installation
          Download the archive for your platform, extract, and use:
          \`\`\`bash
          tar xzf pdf-slim-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          chmod +x pdf-slim
          ./pdf-slim --help
          \`\`\`
          "
